name: CI

on:
  push:
    branches: [main]
  # 开始使用 Pull Request 工作流后,取消下面两行注释
  # pull_request:
  #   branches: [main]

jobs:
  ci:
    name: Install / Lint / Build
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        # 版本读取 package.json 的 packageManager 字段(pnpm@11.28.5)

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
